# Source registry. Adding or removing a source is a config change only.
#
# type:              rss | api | scrape   (prefer rss, then api, then scrape)
# authority_weight:  0.5 (low) .. 1.5 (high); used for ranking and picking cluster representatives
# enabled:           false to skip without deleting
#
# API sources read their key from the environment variable named in `api_key_env`.
# Feed URLs change occasionally; a failing source is logged and shown in the briefing footer.

sources:
  # --- Business & markets -------------------------------------------------
  - name: BBC Business
    type: rss
    url: https://feeds.bbci.co.uk/news/business/rss.xml
    category: Business
    authority_weight: 1.3

  - name: CNBC Top News
    type: rss
    url: https://www.cnbc.com/id/100003114/device/rss/rss.html
    category: Markets
    authority_weight: 1.1

  - name: MarketWatch Top Stories
    type: rss
    url: https://feeds.content.dowjones.io/public/rss/mw_topstories
    category: Markets
    authority_weight: 1.1

  - name: NYT Business
    type: rss
    url: https://rss.nytimes.com/services/xml/rss/nyt/Business.xml
    category: Business
    authority_weight: 1.3

  - name: The Guardian Business
    type: rss
    url: https://www.theguardian.com/uk/business/rss
    category: Business
    authority_weight: 1.2

  - name: Financial Times
    type: rss
    url: https://www.ft.com/rss/home
    category: Business
    authority_weight: 1.4   # mostly paywalled: summaries only, never full text

  # --- Technology ---------------------------------------------------------
  - name: BBC Technology
    type: rss
    url: https://feeds.bbci.co.uk/news/technology/rss.xml
    category: Technology
    authority_weight: 1.2

  - name: NYT Technology
    type: rss
    url: https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml
    category: Technology
    authority_weight: 1.3

  - name: CNBC Technology
    type: rss
    url: https://www.cnbc.com/id/19854910/device/rss/rss.html
    category: Technology
    authority_weight: 1.0

  - name: Ars Technica
    type: rss
    url: https://feeds.arstechnica.com/arstechnica/index
    category: Technology
    authority_weight: 1.1

  - name: The Verge
    type: rss
    url: https://www.theverge.com/rss/index.xml
    category: Technology
    authority_weight: 1.0

  - name: TechCrunch
    type: rss
    url: https://techcrunch.com/feed/
    category: Technology
    authority_weight: 1.0

  - name: Wired
    type: rss
    url: https://www.wired.com/feed/rss
    category: Technology
    authority_weight: 1.0

  # --- APIs ---------------------------------------------------------------
  - name: Hacker News
    type: api
    provider: hackernews        # Algolia HN search API, no key needed
    url: https://hn.algolia.com/api/v1/search_by_date
    category: Technology
    authority_weight: 0.7
    params:
      tags: story
      numericFilters: points>100

  - name: The Guardian API
    type: api
    provider: guardian
    url: https://content.guardianapis.com/search
    category: Business
    authority_weight: 1.2
    api_key_env: GUARDIAN_API_KEY
    enabled: false              # enable after adding the key to Secrets Manager
    params:
      section: business|technology

  - name: NewsAPI Top Business
    type: api
    provider: newsapi
    url: https://newsapi.org/v2/top-headlines
    category: Business
    authority_weight: 1.0
    api_key_env: NEWSAPI_KEY
    enabled: false              # check NewsAPI terms: the free plan is for development only
    params:
      category: business
      language: en

  # --- Scrape (last resort, example) -------------------------------------
  - name: Example Index Page
    type: scrape
    url: https://example.com/news
    category: Technology
    authority_weight: 0.8
    enabled: false
    link_selector: "article h2 a"   # CSS selector for headline links on the index page
