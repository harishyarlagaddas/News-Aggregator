[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "news-aggregator"
version = "0.1.0"
description = "Multi-agent news & insights aggregator that emails a daily executive briefing"
requires-python = ">=3.11"
dependencies = [
    # Orchestration and agents
    "langgraph>=0.4",
    "crewai>=0.150",
    "boto3>=1.35",            # Bedrock (LLM + optional embeddings), S3, SES
    # Fetching and extraction
    "httpx>=0.27",
    "feedparser>=6.0",
    "tenacity>=8.2",
    "selectolax>=0.3",
    "trafilatura>=1.12",
    # Data, vectors, schemas
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # Rendering and logging
    "markdown>=3.6",
    "premailer>=3.10",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Local embedding model (default backend). Install torch CPU wheels first in Docker.
local-embeddings = ["sentence-transformers>=3.0"]
# Headless browser fallback for JavaScript-rendered pages.
browser = ["playwright>=1.45"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "moto[s3,sesv2]>=5.0",
    "ruff>=0.5",
]

[project.scripts]
news-agg = "news_aggregator.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/news_aggregator"]

[tool.hatch.build.targets.wheel.force-include]
"src/news_aggregator/writer/agents.yaml" = "news_aggregator/writer/agents.yaml"
"src/news_aggregator/writer/tasks.yaml" = "news_aggregator/writer/tasks.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
